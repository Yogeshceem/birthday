<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise</title>
<style>
  body {
    margin: 0;
    padding: 0;
    background: #ffe4e1;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: sans-serif;
    flex-direction: column;
  }

  /* Cake layers */
  #cake {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .layer {
    width: 150px;
    height: 30px;
    background: #a0522d;
    border-top-left-radius: 3px;
    border-top-right-radius: 3px;
    margin-top: 4px;
    position: relative;
  }

  .frosting {
    width: 150px;
    height: 10px;
    background: #ff69b4;
    position: absolute;
    top: -10px;
    left: 0;
    border-top-left-radius: 3px;
    border-top-right-radius: 3px;
  }

  /* Candles */
  .candle {
    width: 10px;
    height: 20px;
    background: yellow;
    position: absolute;
    top: -30px;
    border-radius: 2px;
  }

  .flame {
    width: 6px;
    height: 10px;
    background: orange;
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%) rotate(45deg);
    border-radius: 50%;
    box-shadow: 0 0 10px yellow, 0 0 15px red;
    animation: flicker 0.2s infinite alternate;
  }

  @keyframes flicker {
    0% { transform: translateX(-50%) scale(1) rotate(45deg); opacity: 1; }
    50% { transform: translateX(-50%) scale(1.2) rotate(45deg); opacity: 0.8; }
    100% { transform: translateX(-50%) scale(1) rotate(45deg); opacity: 1; }
  }

  /* Timer text */
  #timer {
    margin-top: 20px;
    font-size: 22px;
    font-weight: bold;
    color: #d147a3;
  }

  /* Hearts */
  .heart {
    width: 15px;
    height: 15px;
    position: absolute;
    background: red;
    transform: rotate(45deg);
    pointer-events: none;
  }

  .heart::before, .heart::after {
    content: "";
    width: 15px;
    height: 15px;
    background: red;
    border-radius: 50%;
    position: absolute;
  }

  .heart::before { top: -7.5px; left: 0; }
  .heart::after { left: 7.5px; top: 0; }

  /* Envelope */
  #envelope {
    width: 150px;
    height: 100px;
    background: #fff;
    border: 2px solid #d147a3;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    flex-direction: column;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    transition: transform 0.5s ease;
  }

  #envelope.show {
    transform: translate(-50%, -50%) scale(1);
    animation: bounce 0.5s ease;
  }

  @keyframes bounce {
    0% { transform: translate(-50%, -50%) scale(0.5); }
    50% { transform: translate(-50%, -50%) scale(1.2); }
    100% { transform: translate(-50%, -50%) scale(1); }
  }

  #envelope span {
    font-weight: bold;
    color: #d147a3;
  }

  /* Letter page */
  #letter {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #fff0f5;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-size: 22px;
    padding: 20px;
    box-sizing: border-box;
  }

  #nextBtn {
    margin-top: 20px;
    padding: 10px 25px;
    background: #d147a3;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 18px;
  }

  /* Billie Eilish page */
  #billiePage {
    display: none;
    width: 100%;
    height: 100%;
    background: url('eyes.jpg') no-repeat center center;
    background-size: cover;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    text-align: center;
  }

  .lyrics {
    background: rgba(0,0,0,0.5);
    padding: 20px 40px;
    border-radius: 10px;
    font-size: 24px;
    line-height: 1.5;
    max-width: 80%;
  }

  audio {
    margin-top: 30px;
    outline: none;
  }

</style>
</head>
<body>

<!-- Cake -->
<div id="cake">
  <div class="layer"><div class="frosting"></div></div>
  <div class="layer"><div class="frosting"></div></div>
  <div class="layer"><div class="frosting"></div></div>

  <div class="candle" style="left: 40px;"><div class="flame"></div></div>
  <div class="candle" style="left: 70px;"><div class="flame"></div></div>
  <div class="candle" style="left: 100px;"><div class="flame"></div></div>
</div>

<div id="timer">Blow the candle in 5</div>

<!-- Envelope -->
<div id="envelope">
  <span>Open the envelope!</span>
</div>

<!-- Letter -->
<div id="letter">
  <div>Happy Birthday! 🎉<br><br>
  Wishing you joy, love, and endless smiles.<br>
  Hope your day is as amazing as you are!</div>
  <button id="nextBtn">Next</button>
</div>

<!-- Billie Eilish Page -->
<div id="billiePage">
  <div class="lyrics">
    I'm lost in your ocean eyes<br>
    And I’m scared…<br>
    I’ve never fallen… this deep before
  </div>
  <audio controls autoplay>
    <source src="ocean-eyes-clip.mp3" type="audio/mpeg">
  </audio>
</div>

<script>
let timeLeft = 5;
const timer = document.getElementById('timer');
const envelope = document.getElementById('envelope');
envelope.style.display = 'none';

const countdown = setInterval(() => {
  timeLeft--;
  if(timeLeft > 0) {
    timer.textContent = `Blow the candle in ${timeLeft}`;
  } else {
    clearInterval(countdown);
    timer.style.display = 'none';
    document.getElementById('cake').style.display = 'none';
    startHearts();
    // Show envelope
    setTimeout(() => {
      envelope.style.display = 'flex';
      envelope.classList.add('show');
    }, 1000);
  }
}, 1000);

function startHearts() {
  const screenWidth = window.innerWidth;
  const screenHeight = window.innerHeight;

  for(let i = 0; i < 50; i++) {
    const heart = document.createElement('div');
    heart.classList.add('heart');

    heart.style.left = Math.random() * screenWidth + 'px';
    heart.style.top = -50 + 'px';

    const size = 10 + Math.random() * 15;
    heart.style.width = size + 'px';
    heart.style.height = size + 'px';

    const duration = 3 + Math.random() * 3;
    const delay = Math.random() * 2;

    heart.animate([
      { transform: `translateY(0px) translateX(0px)` },
      { transform: `translateY(${screenHeight + 50}px) translateX(${Math.random()*100-50}px)` }
    ], {
      duration: duration * 1000,
      iterations: Infinity,
      delay: delay * 1000
    });

    document.body.appendChild(heart);
  }
}

// Envelope click
envelope.addEventListener('click', () => {
  envelope.style.display = 'none';
  document.getElementById('letter').style.display = 'flex';
});

// Next button click
document.getElementById('nextBtn').addEventListener('click', () => {
  document.getElementById('letter').style.display = 'none';
  document.getElementById('billiePage').style.display = 'flex';
});
</script>

</body>
</html>
